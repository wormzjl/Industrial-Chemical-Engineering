plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets {
    mcpCompat {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    fluidGameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    // Exercise the actual Minecraft wire/NBT codecs in regression tests as well as the pure science layer.
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://maven.blamejared.com' }
    maven {
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
    maven {
        url = 'https://jitpack.io'
        content {
            includeGroup 'com.github.rtyley'
        }
    }
}

neoForge {
    version = neo_version
    addModdingDependenciesTo sourceSets.fluidGameTest
    addModdingDependenciesTo sourceSets.mcpCompat

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        fluidGameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.fluidGameTest
            def fixtureRun = providers.gradleProperty('fluidGameTestRunId').getOrElse('')
            if (!(fixtureRun ==~ /[A-Za-z0-9_-]*/)) throw new GradleException('Invalid fluidGameTestRunId')
            gameDirectory = layout.projectDirectory.dir(fixtureRun.isEmpty() ? 'run/fluid-gametest' : "run/fluid-gametest-${fixtureRun}")
            systemProperty 'neoforge.enabledGameTestNamespaces', 'icheme_fluid_test'
            systemProperty 'icheme.fluid.testFailure', providers.gradleProperty('fluidGameTestDeliberateFailure').getOrElse('false')
            // Re-derive every island's schedule from scratch at each pump and tick; any drift fails the run.
            systemProperty 'icheme.fluid.scheduler.verify', 'true'
        }
        columnGameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.fluidGameTest
            def fixtureRun = providers.gradleProperty('columnGameTestRunId').getOrElse('manual')
            if (!(fixtureRun ==~ /[A-Za-z0-9_-]+/)) throw new GradleException('Invalid columnGameTestRunId')
            gameDirectory = layout.projectDirectory.dir("run/column-gametest-${fixtureRun}")
            systemProperty 'neoforge.enabledGameTestNamespaces', 'icheme_column_test'
        }
        // A world to review by hand (batch 2026-10-26-multi-machine-framework): the icheme_review GameTests build their
        // plants and leave them standing in run/review-world/world, to be copied into a client's saves. Not a gate.
        reviewWorldServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.fluidGameTest
            gameDirectory = layout.projectDirectory.dir('run/review-world')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'icheme_review'
        }
        fluidBenchmarkServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.fluidGameTest
            def runId = providers.gradleProperty('fluidBenchmarkRunId').getOrElse('manual')
            if (!(runId ==~ /[A-Za-z0-9_-]+/)) throw new GradleException('Use an alphanumeric fluidBenchmarkRunId')
            gameDirectory = layout.projectDirectory.dir("run/fluid-benchmark/${runId}")
            systemProperty 'neoforge.enabledGameTestNamespaces', 'icheme_fluid_benchmark'
            systemProperty 'icheme.fluid.benchmark', 'true'
            systemProperty 'icheme.fluid.benchmark.profile', providers.gradleProperty('fluidBenchmarkProfile').getOrElse('one')
            systemProperty 'icheme.fluid.benchmark.pilot', providers.gradleProperty('fluidBenchmarkPilot').getOrElse('false')
            systemProperty 'icheme.fluid.benchmark.pilotWarmupSeconds', providers.gradleProperty('fluidBenchmarkPilotWarmupSeconds').getOrElse('5')
            systemProperty 'icheme.fluid.stress.warmupSeconds', providers.gradleProperty('fluidStressWarmupSeconds').getOrElse('60')
            systemProperty 'icheme.fluid.stress.measurementSeconds', providers.gradleProperty('fluidStressMeasurementSeconds').getOrElse('60')
            systemProperty 'icheme.fluid.stress.profile', providers.gradleProperty('fluidStressProfile').getOrElse('false')
            systemProperty 'icheme.fluid.benchmark.memory', providers.gradleProperty('fluidBenchmarkMemory').getOrElse('false')
            systemProperty 'icheme.fluid.benchmark.diagnostics', providers.gradleProperty('fluidBenchmarkDiagnostics').getOrElse('false')
            if (providers.gradleProperty('fluidBenchmarkHeapMiB').isPresent()) {
                def heapMiB = providers.gradleProperty('fluidBenchmarkHeapMiB').get().toInteger()
                if (heapMiB < 512 || heapMiB > 16384) throw new GradleException('fluidBenchmarkHeapMiB must be between 512 and 16384')
                jvmArguments.addAll("-Xms${heapMiB}m", "-Xmx${heapMiB}m")
            }
            systemProperty 'icheme.fluid.benchmark.testFailure', providers.gradleProperty('fluidBenchmarkTestFailure').getOrElse('false')
            systemProperty 'icheme.fluid.benchmark.output', layout.buildDirectory.file("reports/fluid/M9/${runId}/report.json").get().asFile.absolutePath
            systemProperty 'icheme.fluid.benchmark.manifest', layout.projectDirectory.file("run/fluid-benchmark/${runId}/manifest.json").asFile.absolutePath
        }

        mcpClient {
            client()
            sourceSet = sourceSets.mcpCompat
            gameDirectory = layout.projectDirectory.dir('run/mcp-client')
            // Window size: -PmcpClientWidth / -PmcpClientHeight (default 854x480) check a GUI at another size without desktop input.
            def mcpWidth = providers.gradleProperty('mcpClientWidth').getOrElse('854')
            def mcpHeight = providers.gradleProperty('mcpClientHeight').getOrElse('480')
            if (!(mcpWidth ==~ /[0-9]{3,4}/ && mcpHeight ==~ /[0-9]{3,4}/)) throw new GradleException('mcpClientWidth and mcpClientHeight must be 3- or 4-digit pixel counts')
            programArguments.addAll('--username', 'FluidMcpTester', '--width', mcpWidth, '--height', mcpHeight)
            // The bridge never moves, grabs or confines the OS cursor, nor sends java.awt.Robot input (agents drive the
            // client while the owner works in other windows).
            systemProperty 'mcp.background_input', 'true'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        icheme_fluid_test {
            sourceSet sourceSets.fluidGameTest
        }
        icheme_mcp_compat {
            sourceSet sourceSets.mcpCompat
        }
    }
    runs.configureEach {
        loadedMods = name in ['fluidGameTestServer', 'fluidBenchmarkServer', 'columnGameTestServer', 'reviewWorldServer'] ? [mods.icheme, mods.icheme_fluid_test]
                : name == 'mcpClient' ? [mods.icheme, mods.icheme_mcp_compat] : [mods.icheme]
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    fluidGameTestImplementation.extendsFrom implementation
    fluidGameTestRuntimeOnly.extendsFrom runtimeOnly
    mcpCompatImplementation.extendsFrom implementation
    mcpCompatRuntimeOnly.extendsFrom runtimeOnly
}

// Optional MCP test-client tooling never enters the production jar or ordinary test runtime.
// The bridge is the official langyo/minecraft-mod-mcp release, run in its background input mode (mcpClient's
// mcp.background_input: the OS cursor is left alone while the game window is in the background); jar and notes:
// tools/minecraft-mcp-bridge/ (main checkout).
def mcpControlModJar = 'minecraft-mcp-1.21.1-neoforge-v0.4.18.jar'
def prepareMcpControlMod = tasks.register('prepareMcpControlMod', Copy) {
    def mcpMods = layout.projectDirectory.dir('run/mcp-client/mods').asFile
    from layout.projectDirectory.file("run/mcp-client-mods/${mcpControlModJar}")
    into mcpMods
    doFirst {
        def jar = inputs.files.singleFile
        if (!jar.isFile()) throw new GradleException("Copy ${mcpControlModJar} from tools/minecraft-mcp-bridge/ (main checkout) into run/mcp-client-mods/ first.")
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString()
        if (digest != 'e9359fce30b13e6337b8a40410ad57bdd31e1b9241ce03502bf668b380bd25f0') {
            throw new GradleException('Minecraft MCP control mod checksum mismatch')
        }
        // One bridge jar in the client: drop earlier pinned versions, leave every other mod alone (plain files: the
        // configuration cache forbids the project at execution time, and the task reruns whenever the folder changes).
        mcpMods.listFiles()?.findAll { it.name.startsWith('minecraft-mcp-') && it.name.endsWith('.jar') && it.name != mcpControlModJar }*.delete()
    }
}
tasks.matching { it.name == 'runMcpClient' }.configureEach { dependsOn prepareMcpControlMod }

dependencies {
    // Sequential sparse LU for the fluid solver; package its runtime graph with the mod.
    implementation('org.ejml:ejml-dsparse:0.44.0')
    additionalRuntimeClasspath('org.ejml:ejml-dsparse:0.44.0')
    ['ejml-core', 'ejml-ddense', 'ejml-dsparse'].each { module ->
        jarJar("org.ejml:${module}:[0.44.0,0.45.0)") {
            version { prefer '0.44.0' }
        }
    }
    // Create's slim development jar deliberately excludes its companion libraries.
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // JEI is an optional client integration: APIs at compile time, full mod only in dev runs.
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    // Milestone 1 requires the KubeJS preset adapter. Its POM supplies Rhino and runtime helpers.
    api("dev.latvian.mods:kubejs-neoforge:${kubejs_version}")

    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

def metadataProperties = [
    minecraft_version      : minecraft_version,
    minecraft_version_range: minecraft_version_range,
    neo_version            : neo_version,
    loader_version_range   : loader_version_range,
    mod_id                 : mod_id,
    mod_name               : mod_name,
    mod_license            : mod_license,
    mod_version            : mod_version,
    mod_authors            : mod_authors,
    mod_description        : mod_description,
    create_version_range   : create_version_range,
    jei_version_range      : jei_version_range,
    kubejs_version_range   : kubejs_version_range
]

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.properties metadataProperties
    expand metadataProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

def configuredTestForks = providers.gradleProperty('testForks').getOrElse('1').toInteger()
if (configuredTestForks < 1 || configuredTestForks > 8) throw new GradleException('testForks must be between 1 and 8')
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxParallelForks = configuredTestForks
    if (providers.gradleProperty('nativeLibraryPath').isPresent())
        systemProperty 'icheme.native.path', providers.gradleProperty('nativeLibraryPath').get()
    if (providers.gradleProperty('nativeThermoBatch').isPresent())
        systemProperty 'icheme.native.thermo.batch', providers.gradleProperty('nativeThermoBatch').get()
}

// The native column solver is an optional shared-library lane. It is never part of the ordinary Java build and
// never launches a solver executable: CMake emits a platform shared library (DLL/SO/DYLIB) loaded by JNI when present.
def nativeSourceDirectory = layout.projectDirectory.dir('src/main/cpp')
def nativeBuildDirectory = layout.buildDirectory.dir('native').get().asFile
def nativeBuildDirectoryPath = nativeBuildDirectory.absolutePath
tasks.register('nativeConfigure', Exec) {
    group = 'native'
    description = 'Configures the optional cross-platform C++ column shared library.'
    inputs.dir(nativeSourceDirectory)
    outputs.dir(nativeBuildDirectory)
    doFirst {
        nativeBuildDirectory.mkdirs()
        commandLine 'cmake', '-S', nativeSourceDirectory.asFile.absolutePath, '-B', nativeBuildDirectory.absolutePath,
                '-DCMAKE_BUILD_TYPE=Release', '-DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY',
                "-DICHEME_JAVA_HOME=${System.getProperty('java.home')}"
    }
}
tasks.register('nativeBuild', Exec) {
    group = 'native'
    description = 'Builds the optional C++ column solver shared library; no solver executable is produced.'
    dependsOn tasks.named('nativeConfigure')
    inputs.dir(nativeSourceDirectory)
    outputs.dir(nativeBuildDirectory)
    doFirst { commandLine 'cmake', '--build', nativeBuildDirectory.absolutePath, '--config', 'Release' }
}
tasks.register('nativeSmoke', Test) {
    group = 'verification'
    description = 'Loads the optional native shared library and checks its JNI version probe; no executable is run.'
    dependsOn tasks.named('nativeBuild'), tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching 'com.wormzjl.icheme.science.column.v3.NativeColumnSolverTest' }
    systemProperty 'icheme.native.path', nativeBuildDirectory.absolutePath
    maxParallelForks = 1
    doLast {
        def nativeFiles = java.nio.file.Files.walk(java.nio.file.Path.of(nativeBuildDirectoryPath))
        try {
            def productExecutable = nativeFiles
                    .filter { java.nio.file.Files.isRegularFile(it) }
                    .filter { it.toString().toLowerCase(java.util.Locale.ROOT).endsWith('.exe') }
                    .filter { !it.toString().replace('\\', '/').contains('/CMakeFiles/') }
                    .findFirst()
            if (productExecutable.isPresent()) {
                throw new GradleException("Native solver build unexpectedly produced executable: ${productExecutable.get()}")
            }
        } finally {
            nativeFiles.close()
        }
    }
}
// Only PackagedSparseLuTest reads the packaged jar; it runs under test and fluidScienceTest.
tasks.withType(Test).matching { it.name in ['test', 'fluidScienceTest'] }.configureEach {
    dependsOn tasks.named('jar')
    systemProperty 'fluid.modJar', tasks.named('jar', Jar).flatMap { it.archiveFile }.get().asFile.absolutePath
}

['fluidScienceTest': 'com.wormzjl.icheme.science.fluid.*',
 'fluidRuntimeTest': 'com.wormzjl.icheme.runtime.fluid.*'].each { taskName, pattern ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = "Runs the discovered ${taskName} checkpoint tests; no matching tests is a failure."
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        filter {
            includeTestsMatching pattern
            if (taskName == 'fluidRuntimeTest') includeTestsMatching 'com.wormzjl.icheme.runtime.Fluid*Test'
            failOnNoMatchingTests = true
        }
        // Re-derive every island's schedule from scratch at each pump and tick; any drift fails the test.
        systemProperty 'icheme.fluid.scheduler.verify', 'true'
    }
}

def fluidBenchmarkRunId = providers.gradleProperty('fluidBenchmarkRunId').getOrElse('manual')
def fluidBenchmarkDirectory = layout.projectDirectory.dir("run/fluid-benchmark/${fluidBenchmarkRunId}").asFile
def fluidBenchmarkWorkerCount = providers.gradleProperty('fluidBenchmarkWorkers').getOrElse('2').toInteger()
// Rest and steady-flow certificates: on by default, as in a world; -PfluidRestDetection=false is the baseline side.
// -PfluidCertificateTolerance overrides eps_s for a sensitivity run only; unset, the world default applies.
def fluidBenchmarkRestDetection = providers.gradleProperty('fluidRestDetection').getOrElse('true')
def fluidBenchmarkCertificateTolerance = providers.gradleProperty('fluidCertificateTolerance').getOrElse('')
def fluidBenchmarkArtifact = tasks.named('jar', Jar).flatMap { it.archiveFile }.get().asFile
def fluidBenchmarkClasses = sourceSets.fluidGameTest.output.classesDirs.files.toList()
def prepareFluidBenchmark = tasks.register('prepareFluidBenchmark') {
    dependsOn tasks.named('jar'), tasks.named('compileFluidGameTestJava')
    doLast {
        def runId = fluidBenchmarkRunId
        if (!(runId ==~ /[A-Za-z0-9_-]+/)) throw new GradleException('Invalid benchmark run id')
        def directory = fluidBenchmarkDirectory
        if (new File(directory, 'world').exists()) throw new GradleException('Benchmark runs require a fresh world; choose a new fluidBenchmarkRunId')
        def workers = fluidBenchmarkWorkerCount
        if (workers < 0 || workers > 32) throw new GradleException('Invalid benchmark worker count')
        def config = new File(directory, 'config/icheme-common.toml')
        config.parentFile.mkdirs()
        def restDetection = fluidBenchmarkRestDetection
        if (!(restDetection in ['true', 'false'])) throw new GradleException('fluidRestDetection must be true or false')
        def tolerance = fluidBenchmarkCertificateTolerance
        if (tolerance && !(tolerance.toDouble() >= 0 && tolerance.toDouble() <= 1e-6)) throw new GradleException('fluidCertificateTolerance must lie in [0, 1e-6]')
        config.text = "[solver]\nworkers = ${workers}\n[fluid]\ninitialIntervalSeconds = 5\nadaptiveCadence = false\nwallBudgetMilliseconds = 2000\nrestDetection = ${restDetection}\n" +
                (tolerance ? "certificateStationaryTolerance = ${tolerance}\n" : "")
        def digest = { byte[] bytes -> java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString() }
        def classHashes = new TreeMap<String,String>()
        fluidBenchmarkClasses.each { root ->
            if (root.exists()) root.eachFileRecurse { entry -> if (entry.isFile()) classHashes[root.toPath().relativize(entry.toPath()).toString().replace('\\','/')] = digest(entry.bytes) }
        }
        def manifest = [runId:runId, configuredWorkers:workers, artifact:fluidBenchmarkArtifact.name,
                artifactSha256:digest(fluidBenchmarkArtifact.bytes), fixtureClassesSha256:digest(groovy.json.JsonOutput.toJson(classHashes).getBytes('UTF-8')),
                configSha256:digest(config.bytes), fixtureClassHashes:classHashes]
        new File(directory,'manifest.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest))
    }
}
tasks.named('runFluidBenchmarkServer') { dependsOn prepareFluidBenchmark }
def fluidBenchmarkReportFile = layout.buildDirectory.file("reports/fluid/M9/${fluidBenchmarkRunId}/report.json").get().asFile
tasks.register('fluidServerBenchmark') {
    group = 'verification'
    description = 'Runs one fresh-JVM paced server replicate; explicit pilot runs are never qualification passes.'
    dependsOn tasks.named('runFluidBenchmarkServer')
    doLast {
        def logFile = new File(fluidBenchmarkDirectory, 'logs/latest.log')
        if (!logFile.isFile() || !fluidBenchmarkReportFile.isFile()) throw new GradleException('Missing benchmark report/runtime log')
        def patterns = ['Error executing task on Server', 'process_solver lifecycle=DRAIN_FAILED',
                'Encountered an unexpected exception', 'Game test server crashed', 'process_solver lifecycle=STOPPED_WITH_FAULT',
                'OutOfMemoryError', 'fluid_presentation device=']
        def matches = logFile.readLines('UTF-8').findAll { line -> patterns.any { line.contains(it) } }
        def report = new groovy.json.JsonSlurper().parse(fluidBenchmarkReportFile)
        def digest = { byte[] bytes -> java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString() }
        def audit = [status:matches.isEmpty() ? 'PASS' : 'FAILED_RUNTIME_ERRORS', errorCount:matches.size(),
                patterns:patterns, examples:matches.take(25), artifactSha256:report.manifest.artifactSha256,
                reportSha256:digest(fluidBenchmarkReportFile.bytes), logSha256:digest(logFile.bytes)]
        new File(fluidBenchmarkReportFile.parentFile, 'runtime-audit.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(audit))
        if (!matches.isEmpty()) throw new GradleException("Benchmark had ${matches.size()} runtime errors; numerical gates cannot qualify this run")
    }
}
tasks.register('fluidSolverRegression', Test) {
    group = 'verification'
    description = 'Replays the chain-100 fixture against its captured solver reference states and reports solver cost.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching 'com.wormzjl.icheme.fluid.benchmark.FluidSolverRegressionTest'; failOnNoMatchingTests = true }
    maxParallelForks = 1
    testLogging { showStandardStreams = true }
    if (providers.gradleProperty('fluidRegressionReferences').isPresent())
        systemProperty 'fluid.regression.references', providers.gradleProperty('fluidRegressionReferences').get()
    systemProperty 'fluid.regression.capture', providers.gradleProperty('fluidRegressionCapture').getOrElse('false')
    systemProperty 'fluid.regression.mode', providers.gradleProperty('fluidRegressionMode').getOrElse('declared')
    if (providers.gradleProperty('fluidRegressionTraceCutoff').isPresent())
        systemProperty 'fluid.regression.traceCutoff', providers.gradleProperty('fluidRegressionTraceCutoff').get()
    outputs.upToDateWhen { false }
}
// The slow gates (3 s or more each at 0.11.0, 216 of the suite's 262 s): the everyday `test` leaves them out and
// `slowGates` runs them; `check` (so `build`) and the final lane run both.
def slowGateClasses = ['runtime.fluid.HoldClassWorldsTest', 'science.column.v3.thermo.RegroupedCrudeTest',
        'science.equipment.ProcessUnitTest', 'science.column.v3.V3SideDrawCalculatorTest', 'science.column.v3.V3LearnedRecoveryTest',
        'science.column.v3.V3ConvergenceClosureTest', 'science.column.v3.V3PumparoundCalculatorTest',
        'science.column.v3.V3StageContinuationTest', 'science.column.v3.V3PumparoundSteamCalculatorTest',
        'science.column.v3.V3MethaneColumnTest', 'runtime.fluid.JunctionSeedingGateTest', 'science.column.v3.V3ColumnCalculatorTest',
        'science.column.v3.V3ColumnFeedAndDrawLimitsTest', 'science.column.v3.V3TrayHydraulicsColumnTest',
        'science.column.v3.V3LiteraturePresetTest', 'runtime.fluid.IslandSchedulerTest', 'science.column.v3.V3ColdStartTest',
        'runtime.fluid.ExtremeTopologyIslandTest'].collect { "com.wormzjl.icheme.${it}" }
tasks.named('test', Test) {
    // The fluid GameTests compile with the quick suite: only their server run compiled them, and a removed block left
    // them uncompilable for two days unseen (batch 2026-10-21-floating-roof-tanks, FINAL_LANE_E8EC6455_REVIEW.md).
    dependsOn tasks.named('compileFluidGameTestJava')
    exclude '**/fluid/benchmark/**'
    filter { slowGateClasses.each { excludeTestsMatching it } }
    systemProperty 'icheme.fluid.scheduler.verify', 'true'
}
def slowGates = tasks.register('slowGates', Test) {
    group = 'verification'
    description = 'Runs the slow gate classes the everyday test leaves out; a missing class is a failure.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        slowGateClasses.each { includeTestsMatching it }
        failOnNoMatchingTests = true
    }
    systemProperty 'icheme.fluid.scheduler.verify', 'true'
}
tasks.named('check') { dependsOn slowGates }

tasks.register('v3HollandBenchmark', Test) {
    group = 'verification'
    description = 'Runs the scan-verified Holland Example 3-2 independent-oracle and V3 accuracy benchmark.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'com.wormzjl.icheme.science.column.v3.HollandExample32BenchmarkTest'
    }
    def hollandReport = providers.gradleProperty('v3HollandReport').getOrElse(
            layout.buildDirectory.file('reports/benchmarks/v3-holland-example-3-2.json').get().asFile.absolutePath)
    systemProperty 'v3HollandReport', hollandReport
    outputs.file(hollandReport)
    outputs.upToDateWhen { false }
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

// Local research tooling is optional and is not distributed with the mod sources.
if (file('tools/development.gradle').isFile()) {
    apply from: 'tools/development.gradle'
}

// A missing, duplicate or stale standalone material index is a build failure.
def bundledMaterialFiles = fileTree('src/main/resources/data') { include '**/materials/**/*.json' }
def bundledMaterialRoot = layout.projectDirectory.dir('src/main/resources').asFile
def bundledMaterialIndex = layout.projectDirectory.file('src/main/resources/materials-index.json').asFile
tasks.register('verifyMaterialIndex') {
    inputs.files(bundledMaterialFiles)
    inputs.file(bundledMaterialIndex)
    doLast {
        def indexed = new groovy.json.JsonSlurper().parse(bundledMaterialIndex)
        def actual = bundledMaterialFiles.files.collect { bundledMaterialRoot.toPath().relativize(it.toPath()).toString().replace('\\', '/') }.sort()
        if (!(indexed instanceof List) || indexed.size() != indexed.toSet().size() || indexed.sort() != actual)
            throw new GradleException('materials-index.json must list each bundled material JSON exactly once')
    }
}
tasks.named('processResources').configure { dependsOn tasks.named('verifyMaterialIndex') }
