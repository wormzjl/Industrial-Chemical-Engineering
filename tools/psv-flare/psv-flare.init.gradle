// Attaches this folder's src/ to the fluidGameTest source set for one Gradle invocation: ReliefFlareRun, the blocked-in
// drum relieving to a flare in the review server's namespace. Use through run.sh. Not part of any gate.
gradle.projectsEvaluated {
    def here = gradle.startParameter.initScripts.find { it.name == 'psv-flare.init.gradle' }.parentFile
    gradle.rootProject.sourceSets.fluidGameTest.java.srcDir(new File(here, 'src'))
}
