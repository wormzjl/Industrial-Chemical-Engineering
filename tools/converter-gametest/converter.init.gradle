// Attaches this folder's src/ to the fluidGameTest source set for one Gradle invocation: ConverterRun, the fluid converter's
// GameTests in the review server's namespace. Use through run.sh. Not part of any gate.
gradle.projectsEvaluated {
    def here = gradle.startParameter.initScripts.find { it.name == 'converter.init.gradle' }.parentFile
    gradle.rootProject.sourceSets.fluidGameTest.java.srcDir(new File(here, 'src'))
}
