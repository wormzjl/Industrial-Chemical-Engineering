// Attaches this folder's src/ to the test source set for one Gradle invocation and forwards the fuzz switches:
//   ./gradlew --no-configuration-cache --init-script tools/phase-ports-probes/hold-fuzz/hold-fuzz.init.gradle test \
//       --tests '*HoldFuzzTest' -PholdFuzzSeeds=1-300 -PholdFuzzThreads=8 -PholdFuzzOut=<file> [-PholdFuzzSlices=120]
//       [-PholdFuzzVerbose=true] [-PholdFuzzStrict=true] [-PholdFuzzCold=true] (M3: the pilot package's cold worlds)
// Not part of any gate suite: without this init script the class is not compiled.
gradle.projectsEvaluated {
    def here = gradle.startParameter.initScripts.find { it.name == 'hold-fuzz.init.gradle' }.parentFile
    def root = gradle.rootProject
    root.sourceSets.test.java.srcDir(new File(here, 'src'))
    // -PholdFuzzInstr=true: the singular-Jacobian probes, which need ../holds3/instr/instr-f8-singular-dump.patch applied.
    if (root.findProperty('holdFuzzInstr')) { root.sourceSets.test.java.srcDir(new File(here, 'instr')); root.sourceSets.test.java.srcDir(new File(here, '../holds3/instr')) }
    root.tasks.withType(Test).configureEach {
        maxHeapSize = root.findProperty('holdFuzzHeap') ?: '8g'
        systemProperty 'holdFuzz.seeds', root.findProperty('holdFuzzSeeds') ?: '1-20'
        systemProperty 'holdFuzz.threads', root.findProperty('holdFuzzThreads') ?: '8'
        systemProperty 'holdFuzz.slices', root.findProperty('holdFuzzSlices') ?: '120'
        systemProperty 'holdFuzz.verbose', root.findProperty('holdFuzzVerbose') ?: 'false'
        systemProperty 'holdFuzz.strict', root.findProperty('holdFuzzStrict') ?: 'false'
        systemProperty 'holdFuzz.defaults', root.findProperty('holdFuzzDefaults') ?: 'false'
        systemProperty 'holdFuzz.counters', root.findProperty('holdFuzzCounters') ?: 'false'
        // -Pm3Trace=true: the M3 trace prints (probes/specs/*-print.json, applied by hand and restored).
        systemProperty 'm3.trace', root.findProperty('m3Trace') ?: 'false'
        systemProperty 'holdFuzz.cold', root.findProperty('holdFuzzCold') ?: 'false'
        systemProperty 'holdFuzz.pipeBetween', root.findProperty('holdFuzzPipeBetween') ?: 'true'
        // Batch 2026-11-03-rotating-machinery: -PholdFuzzMachines=true runs the centrifugal variant (each in-line mover a machine
        // on its curve, rated from its settings). Form F2b, the set-flow movers' corner law, is the code's only law since
        // the owner's choice of 2026-11-04; -PholdFuzzCornerLaw switched it before (commits 218f9c5ff, ffae9fc4d).
        systemProperty 'holdFuzz.machines', root.findProperty('holdFuzzMachines') ?: 'false'
        systemProperty 'holdFuzz.out', root.findProperty('holdFuzzOut') ?: new File(here, 'logs/report.txt').absolutePath
        testLogging { showStandardStreams = true }
        outputs.upToDateWhen { false }
    }
}
